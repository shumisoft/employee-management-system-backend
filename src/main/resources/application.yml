server:
    port: ${PORT}
spring:
    application:
        name: employee-management-system
    datasource:
        url: ${DATASOURCE_URL}
        username: ${DATASOURCE_USERNAME}
        password: ${DATASOURCE_PASSWORD}
        driver-class-name: org.postgresql.Driver
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
logging:
    level:
        org:
            springframework:
                security: TRACE
jwt:
    secret: ${JWT_SECRET}
    expiry-ms: ${JWT_EXPIRY_MS}
    refresh-expiry-ms: ${JWT_REFRESH_EXPIRY_MS}

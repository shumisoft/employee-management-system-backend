services:
  # 1. NGINX CONFIG SEEDER
  config-helper:
    image: alpine
    volumes:
      - ./nginx:/src:ro
      - nginx_config:/dest
    command: cp /src/nginx.conf /dest/nginx.conf

  # 2. DATABASE
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    networks:
      - internal-net
    environment:
      # POSTGRES specific keys required for initialization
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-ems_db}

  # 3. BACKEND
  ems-be:
    image: dipanshushukla/employee-management-system:latest-dev
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    restart: unless-stopped
    deploy:
      replicas: 4
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        delay: 10s
    networks:
      - internal-net
    depends_on:
      - db
    environment:
      # Link these to the same values used in the 'db' service
      DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME:-ems_db}
      DATASOURCE_USERNAME: ${DB_USER:-postgres}
      DATASOURCE_PASSWORD: ${DB_PASSWORD:-password}
      JWT_SECRET: ${JWT_SECRET_KEY:-some-hardcoded-very-unsafe-secret}
      JWT_EXPIRY_MS: 10800000
      JWT_REFRESH_EXPIRY_MS: 43200000
      PORT: 1337

  # 4. NGINX REVERSE PROXY
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      config-helper:
        condition: service_completed_successfully
    networks:
      internal-net:
      olympusconnect:
        aliases:
          - ems-be-nginx-proxy
    
    volumes:
      - nginx_config:/etc/nginx:ro

networks:
  internal-net:
    internal: true
  olympusconnect:
    external: true
    name: OlympusConnect

volumes:
  nginx_config: